# Run LifeOS as a single container.
#
#   cp .env.example .env     # then fill it in
#   docker compose up -d --build
#
# There is no database service here. The data and the sign-in accounts live
# in NoCodeBackend, named by NCB_INSTANCE in .env, and the app reaches it over
# HTTPS. Nothing is migrated on boot.

services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: ${LIFEOS_TIMEZONE:-America/Chicago}
    ports:
      - "${LIFEOS_PORT:-3001}:3001"
    healthcheck:
      # /api/health asks NoCodeBackend a question, so this means "serving and
      # the store answers", not merely "the process is alive".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
